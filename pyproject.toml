[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devagent"
version = "0.1.0"
description = "DevAgent project bootstrap"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jieba>=0.42,<1",
    "openai>=1.0.0",
    "pydantic>=2.0,<3",
    "python-dotenv>=1.0,<2",
    "rank-bm25>=0.2,<1",
]

[project.scripts]
devagent = "devagent.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]
